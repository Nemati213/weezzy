spring:
  application:
    name: weezzy
  data:
    redis:
      repositories:
        enabled: false
  profiles:
    default: local

app:
  frontend:
    base-url: http://localhost:3000
  profile-photo:
    max-file-size: ${PROFILE_PHOTO_MAX_FILE_SIZE:10485760}
    max-photos: ${PROFILE_PHOTO_MAX_COUNT:6}
    pending-ttl: ${PROFILE_PHOTO_PENDING_TTL:P1D}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  recommendation:
    weights:
      skill: 3
      interest: 2
      goal: 5
    impression-cooldown: 7d
  security:
    access-token-revocation:
      enabled: ${ACCESS_TOKEN_REVOCATION_ENABLED:true}
    jwt:
      secret: weezzy-dev-secret-must-be-changed-before-production-123456
      access-token-ttl: PT15M
    session:
      refresh-token-ttl: P30D
      max-ttl: P90D
    rate-limit:
      enabled: false
      login:
        capacity: 10
        window: 1m
      register:
        capacity: 5
        window: 1h
      email-resend:
        capacity: 3
        window: 1h
      password-forgot:
        capacity: 3
        window: 1h
    email-verification:
      token-ttl: PT24H
    password-reset:
      token-ttl: PT30M
  mail:
    from: no-reply@weezzy.local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    version: ${WEEZZY_VERSION:dev}
