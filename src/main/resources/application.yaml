spring:
  application:
    name: weezzy
  data:
    redis:
      repositories:
        enabled: false
  profiles:
    default: local

app:
  recommendation:
    weights:
      skill: 3
      interest: 2
      goal: 5
    impression-cooldown: 7d
  security:
    jwt:
      secret: weezzy-dev-secret-must-be-changed-before-production-123456
      access-token-ttl: PT1H
    rate-limit:
      enabled: false
      login:
        capacity: 10
        window: 1m
      register:
        capacity: 5
        window: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    version: ${WEEZZY_VERSION:dev}
