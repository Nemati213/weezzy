spring:
  application:
    name: weezzy
  data:
    redis:
      repositories:
        enabled: false
  profiles:
    default: local

app:
  frontend:
    base-url: http://localhost:3000
  lunch:
    zone-id: ${LUNCH_ZONE_ID:Europe/Moscow}
    window-start: ${LUNCH_WINDOW_START:12:00}
    window-end: ${LUNCH_WINDOW_END:15:00}
    slot-interval: ${LUNCH_SLOT_INTERVAL:PT15M}
    extension-duration: ${LUNCH_EXTENSION_DURATION:PT10M}
    max-extensions: ${LUNCH_MAX_EXTENSIONS:2}
    extension-response-timeout: ${LUNCH_EXTENSION_RESPONSE_TIMEOUT:PT5M}
    group-duration: ${LUNCH_GROUP_DURATION:PT1H}
    matching:
      enabled: ${LUNCH_MATCHING_ENABLED:true}
      fixed-delay: ${LUNCH_MATCHING_FIXED_DELAY:PT1M}
      bucket-batch-size: ${LUNCH_MATCHING_BUCKET_BATCH_SIZE:50}
    lifecycle:
      enabled: ${LUNCH_LIFECYCLE_ENABLED:true}
      fixed-delay: ${LUNCH_LIFECYCLE_FIXED_DELAY:PT1M}
      batch-size: ${LUNCH_LIFECYCLE_BATCH_SIZE:100}
  profile-photo:
    max-file-size: ${PROFILE_PHOTO_MAX_FILE_SIZE:10485760}
    max-photos: ${PROFILE_PHOTO_MAX_COUNT:6}
    pending-ttl: ${PROFILE_PHOTO_PENDING_TTL:P1D}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  recommendation:
    weights:
      skill: 3
      interest: 2
      goal: 5
    impression-cooldown: 7d
  outbox:
    worker:
      enabled: ${OUTBOX_WORKER_ENABLED:true}
      fixed-delay: ${OUTBOX_WORKER_FIXED_DELAY:PT1S}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE:50}
      max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS:5}
      lock-timeout: ${OUTBOX_WORKER_LOCK_TIMEOUT:PT5M}
      retry-delays:
        - ${OUTBOX_RETRY_DELAY_1:PT1M}
        - ${OUTBOX_RETRY_DELAY_2:PT5M}
        - ${OUTBOX_RETRY_DELAY_3:PT15M}
        - ${OUTBOX_RETRY_DELAY_4:PT1H}
      worker-id: ${OUTBOX_WORKER_ID:}
    cleanup:
      enabled: ${OUTBOX_CLEANUP_ENABLED:true}
      fixed-delay: ${OUTBOX_CLEANUP_FIXED_DELAY:PT1H}
      retention: ${OUTBOX_PROCESSED_RETENTION:P7D}
      batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:500}
  security:
    access-token-revocation:
      enabled: ${ACCESS_TOKEN_REVOCATION_ENABLED:true}
    jwt:
      secret: weezzy-dev-secret-must-be-changed-before-production-123456
      access-token-ttl: PT15M
    session:
      refresh-token-ttl: P30D
      max-ttl: P90D
    rate-limit:
      enabled: false
      login:
        capacity: 10
        window: 1m
      register:
        capacity: 5
        window: 1h
      email-resend:
        capacity: 3
        window: 1h
      password-forgot:
        capacity: 3
        window: 1h
    email-verification:
      token-ttl: PT24H
    password-reset:
      token-ttl: PT30M
  mail:
    from: no-reply@weezzy.local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    version: ${WEEZZY_VERSION:dev}
