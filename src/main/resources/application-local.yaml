spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/weezzy
    username: weezzy
    password: weezzy_dev_password
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:weezzy}
    secret-key: ${S3_SECRET_KEY:weezzy_dev_password}
    bucket: ${S3_BUCKET:weezzy-profile-photos}
    upload-url-ttl: ${S3_UPLOAD_URL_TTL:PT15M}
    download-url-ttl: ${S3_DOWNLOAD_URL_TTL:PT1H}
